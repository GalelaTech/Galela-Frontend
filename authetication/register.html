<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galela Tech – Create Account</title>
    <!-- same font & icon set -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050510;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(43, 127, 255, 0.1) 0%, transparent 55%),
                        radial-gradient(circle at 90% 70%, rgba(100, 160, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        :root {
            --deep-navy:   #0b0b1a;
            --glow-blue:   #2b7fff;
            --sky-stroke:  #7bb3ff;
            --accent-glow: #4d9eff;
            --text-muted:  #b0c8e5;
            --card-bg:     rgba(20, 30, 55, 0.8);
            --error:       #ff5f6d;
            --success:     #28a745;
            --online-green: #22c55e;
            --warning:     #f59e0b;
        }

        .auth-wrapper {
            width: 90%;
            max-width: 500px;
            z-index: 10;
            margin: 2rem auto;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(123, 179, 255, 0.25);
            border-radius: 48px;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 35px 60px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(43, 127, 255, 0.2) inset;
            transition: 0.3s;
        }

        .auth-card:hover {
            border-color: var(--glow-blue);
            box-shadow: 0 35px 60px -15px rgba(43, 127, 255, 0.3);
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .auth-logo img {
            height: 65px;
            filter: drop-shadow(0 0 12px var(--glow-blue));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--sky-stroke) 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Connection Status Indicator */
        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(20, 30, 55, 0.5);
            border-radius: 40px;
            border: 1px solid rgba(123,179,255,0.2);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--online-green);
            box-shadow: 0 0 10px var(--online-green);
            animation: pulse 2s infinite;
        }
        .status-dot.offline {
            background: var(--error);
            box-shadow: 0 0 10px var(--error);
            animation: none;
        }
        .status-dot.checking {
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .status-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Alert Messages */
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }

        .alert i {
            font-size: 1.2rem;
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: var(--success);
        }

        .alert-error {
            background: rgba(255, 95, 109, 0.1);
            border: 1px solid rgba(255, 95, 109, 0.2);
            color: var(--error);
        }

        .form-group {
            margin-bottom: 1.3rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #cad7f0;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(10, 20, 40, 0.7);
            border: 1px solid #2a4070;
            border-radius: 40px;
            padding: 0.1rem 1.2rem;
            transition: 0.2s;
            position: relative;
        }
        .input-wrapper:hover,
        .input-wrapper:focus-within {
            border-color: var(--glow-blue);
            box-shadow: 0 0 0 3px rgba(43, 127, 255, 0.2);
        }
        .input-wrapper i {
            color: var(--glow-blue);
            font-size: 1.2rem;
            margin-right: 0.8rem;
            opacity: 0.9;
        }
        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.9rem 0;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-wrapper input::placeholder {
            color: #5f7faf;
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .password-toggle:hover {
            color: var(--glow-blue);
        }

        /* role selection */
        .role-selection {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .role-option {
            flex: 1;
            min-width: 100px;
            text-align: center;
            padding: 12px;
            border: 1px solid #2a4070;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(10, 20, 40, 0.7);
        }

        .role-option:hover {
            border-color: var(--glow-blue);
            background: rgba(43, 127, 255, 0.1);
        }

        .role-option.active {
            border-color: var(--glow-blue);
            background: rgba(43, 127, 255, 0.2);
        }

        .role-option i {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            transition: 0.2s;
        }

        .role-option.active i {
            color: var(--glow-blue);
        }

        .role-option span {
            display: block;
            font-weight: 500;
            color: #cad7f0;
            font-size: 0.9rem;
        }

        /* terms & checkbox */
        .terms {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin: 1.8rem 0 2rem;
            color: #b0c8e5;
            font-size: 0.9rem;
        }
        .terms input {
            accent-color: var(--glow-blue);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .terms a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid var(--glow-blue);
        }

        .auth-btn {
            width: 100%;
            background: linear-gradient(145deg, var(--glow-blue), #1755cc);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1.1rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 10px 25px rgba(43, 127, 255, 0.4);
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .auth-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(145deg, #3d8cff, #1f4fcc);
            box-shadow: 0 18px 35px rgba(43, 127, 255, 0.6);
        }

        .auth-btn.loading {
            position: relative;
            color: transparent;
        }

        .auth-btn.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #4f6f9f;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #2b7fff, transparent);
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin-bottom: 1.8rem;
        }
        .social-icon {
            color: #b0c8e5;
            font-size: 1.8rem;
            transition: 0.2s;
        }
        .social-icon:hover {
            color: var(--glow-blue);
            transform: translateY(-3px);
        }

        .login-prompt {
            text-align: center;
            color: var(--text-muted);
        }
        .login-prompt a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid var(--glow-blue);
            padding-bottom: 2px;
        }
        .login-prompt a:hover {
            color: var(--sky-stroke);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .back-link i {
            margin-right: 6px;
            color: var(--glow-blue);
        }
        .back-link:hover {
            color: white;
        }

        @media (max-width: 576px) {
            .auth-card { padding: 2rem 1.5rem; }
            .role-selection { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="https://i.postimg.cc/5y68Fqyv/Chat-GPT-Image-Mar-6-2026-10-08-30-PM.png" alt="Galela Tech">
            </div>
            <div class="auth-header">
                <h2>Get Started</h2>
                <p>Create your Galela Tech account</p>
            </div>

            <!-- Connection Status Indicator -->
            <div class="connection-status" id="connectionStatus">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Checking server connection...</span>
            </div>

            <!-- Alert Messages -->
            <div class="alert alert-error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <div class="alert alert-success" id="successAlert">
                <i class="fas fa-check-circle"></i>
                <span id="successMessage"></span>
            </div>

            <!-- Role Selection -->
            <div class="role-selection">
                <div class="role-option active" data-role="customer">
                    <i class="fas fa-user"></i>
                    <span>Customer</span>
                </div>
                <div class="role-option" data-role="driver">
                    <i class="fas fa-truck"></i>
                    <span>Driver</span>
                </div>
                <div class="role-option" data-role="admin">
                    <i class="fas fa-cog"></i>
                    <span>Admin</span>
                </div>
            </div>

            <form id="registerForm">
                <!-- full name -->
                <div class="form-group">
                    <label>Full name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullName" placeholder="Alex Johnson" required>
                    </div>
                </div>
                <!-- email -->
                <div class="form-group">
                    <label>Email address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@gmail.com or work@company.com" required>
                    </div>
                </div>
                <!-- username -->
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="text" id="username" placeholder="alexj" required>
                    </div>
                </div>
                <!-- phone number (NEW) -->
                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phoneNumber" placeholder="0712345678" pattern="[0-9]{10,15}">
                    </div>
                </div>
                <!-- password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <!-- confirm password -->
                <div class="form-group">
                    <label>Confirm password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                        <button type="button" class="password-toggle" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="termsCheck" required>
                    <label for="termsCheck">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="auth-btn" id="registerButton">
                    <i class="fas fa-user-plus"></i>
                    <span>Create Account</span>
                </button>
            </form>

            <div class="divider">or sign up with</div>

            <div class="social-login">
                <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-microsoft"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
            </div>

            <div class="login-prompt">
                Already have an account? <a href="loginform.html">Sign in</a>
            </div>

            <div style="text-align: center;">
                <a href="/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GALELA TECH - REGISTRATION SYSTEM
        // UPDATED FOR LOCAL BACKEND
        // ============================================

        // DOM Elements
        const registerForm = document.getElementById('registerForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
        const registerButton = document.getElementById('registerButton');
        const termsCheck = document.getElementById('termsCheck');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const successAlert = document.getElementById('successAlert');
        const successMessage = document.getElementById('successMessage');
        const roleOptions = document.querySelectorAll('.role-option');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ============================================
        // CONFIGURATION - LOCAL BACKEND
        // ============================================
        const APP_CONFIG = {
            // Local backend URL
            API_BASE_URL: 'https://cv-software-backend.onrender.com',
            
            API_ENDPOINTS: {
                register: '/api/auth/register/',
                login: '/api/auth/login/',
                health: '/api/health/'
            },
            
            // Timeouts
            TIMEOUTS: {
                API_REQUEST: 30000,
                REDIRECT_DELAY: 1500,
                ALERT_DISPLAY: 5000,
                CONNECTION_CHECK: 30000
            }
        };

        // ============================================
        // CONNECTION STATUS CHECK
        // ============================================
        let connectionCheckInterval = null;
        
        async function checkServerConnection() {
            statusDot.className = 'status-dot checking';
            statusText.textContent = 'Checking server connection...';
            
            try {
                const response = await fetch(APP_CONFIG.API_BASE_URL + APP_CONFIG.API_ENDPOINTS.health, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Connected to server';
                    return true;
                } else {
                    throw new Error('Server not responding');
                }
            } catch (error) {
                console.warn('Server connection failed:', error);
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Server offline - Using local mode';
                return false;
            }
        }
        
        function startConnectionMonitoring() {
            checkServerConnection();
            connectionCheckInterval = setInterval(checkServerConnection, APP_CONFIG.TIMEOUTS.CONNECTION_CHECK);
        }
        
        function stopConnectionMonitoring() {
            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
            }
        }

        // ============================================
        // PASSWORD VALIDATION
        // ============================================
        function validatePassword(password) {
            const errors = [];
            
            if (password.length < 8) {
                errors.push("Password must be at least 8 characters long");
            }
            if (!/[A-Z]/.test(password)) {
                errors.push("Password must contain at least one uppercase letter");
            }
            if (!/[a-z]/.test(password)) {
                errors.push("Password must contain at least one lowercase letter");
            }
            if (!/[0-9]/.test(password)) {
                errors.push("Password must contain at least one number");
            }
            if (!/[!@#$%^&*]/.test(password)) {
                errors.push("Password must contain at least one special character (!@#$%^&*)");
            }
            
            return {
                isValid: errors.length === 0,
                errors: errors
            };
        }

        // ============================================
        // UI HELPER FUNCTIONS
        // ============================================
        
        // Toggle password visibility
        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        }

        if (toggleConfirmPasswordBtn) {
            toggleConfirmPasswordBtn.addEventListener('click', function() {
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        }

        // Role selection
        let selectedRole = 'customer'; // default
        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                roleOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                selectedRole = this.dataset.role;
            });
        });

        // Show/hide alerts
        function showAlert(alertElement, message, isError = true) {
            if (isError) {
                errorMessage.textContent = message;
                errorAlert.style.display = 'flex';
                successAlert.style.display = 'none';
            } else {
                successMessage.textContent = message;
                successAlert.style.display = 'flex';
                errorAlert.style.display = 'none';
            }
            
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, APP_CONFIG.TIMEOUTS.ALERT_DISPLAY);
        }

        // ============================================
        // REGISTRATION FORM SUBMISSION
        // ============================================
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get form values
            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const username = usernameInput.value.trim();
            const phoneNumber = phoneNumberInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validation
            if (!fullName || !email || !username || !password || !confirmPassword) {
                showAlert(errorAlert, "Please fill in all required fields.");
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert(errorAlert, "Please enter a valid email address.");
                return;
            }

            // Username validation
            if (username.length < 3) {
                showAlert(errorAlert, "Username must be at least 3 characters long.");
                return;
            }

            // Phone validation (optional)
            if (phoneNumber && !/^[0-9]{10,15}$/.test(phoneNumber)) {
                showAlert(errorAlert, "Please enter a valid phone number (10-15 digits).");
                return;
            }

            // Password match
            if (password !== confirmPassword) {
                showAlert(errorAlert, "Passwords do not match.");
                return;
            }

            // Password strength
            const passwordValidation = validatePassword(password);
            if (!passwordValidation.isValid) {
                showAlert(errorAlert, passwordValidation.errors[0]);
                return;
            }

            // Terms agreement
            if (!termsCheck.checked) {
                showAlert(errorAlert, "You must agree to the Terms of Service and Privacy Policy.");
                return;
            }

            // Check server connection
            const isServerOnline = await checkServerConnection();

            // Show loading state
            registerButton.classList.add('loading');
            registerButton.disabled = true;
            registerButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            try {
                if (isServerOnline) {
                    // Online mode - register with backend
                    
                    // Prepare registration data for your User model
                    const registrationData = {
                        username: username,
                        email: email,
                        password: password,
                        first_name: fullName.split(' ')[0] || '',
                        last_name: fullName.split(' ').slice(1).join(' ') || '',
                        phone_number: phoneNumber || '',
                        role: selectedRole
                    };

                    console.log('Registration Data:', registrationData);

                    const response = await fetch(APP_CONFIG.API_BASE_URL + APP_CONFIG.API_ENDPOINTS.register, {
                        method: "POST",
                        mode: "cors",
                        headers: { 
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(registrationData)
                    });

                    console.log('Registration Response Status:', response.status);

                    let data;
                    try {
                        data = await response.json();
                        console.log('Registration Response Data:', data);
                    } catch (jsonError) {
                        console.error('JSON Parse Error:', jsonError);
                        showAlert(errorAlert, "Server response error. Please try again.");
                        return;
                    }

                    if (response.ok && (response.status === 200 || response.status === 201)) {
                        // ✅ REGISTRATION SUCCESSFUL
                        
                        showAlert(successAlert, "Registration successful! Redirecting to login...", false);

                        // Redirect to login page after delay
                        setTimeout(() => {
                            window.location.href = `loginform.html?registered=true&email=${encodeURIComponent(email)}`;
                        }, APP_CONFIG.TIMEOUTS.REDIRECT_DELAY);

                    } else {
                        // ❌ REGISTRATION FAILED
                        let errorMsg = "Registration failed. ";
                        
                        if (data.detail) {
                            errorMsg += data.detail;
                        } else if (data.error) {
                            errorMsg += data.error;
                        } else if (data.email) {
                            errorMsg += "Email: " + (Array.isArray(data.email) ? data.email[0] : data.email);
                        } else if (data.username) {
                            errorMsg += "Username: " + (Array.isArray(data.username) ? data.username[0] : data.username);
                        } else if (data.password) {
                            errorMsg += "Password: " + (Array.isArray(data.password) ? data.password[0] : data.password);
                        } else if (data.non_field_errors) {
                            errorMsg += data.non_field_errors[0];
                        } else if (data.message) {
                            errorMsg += data.message;
                        } else if (response.status === 400) {
                            errorMsg += "Invalid data provided. Please check your input.";
                        } else if (response.status === 409) {
                            errorMsg += "User with this email or username already exists.";
                        } else if (response.status === 500) {
                            errorMsg += "Server error. Please try again later.";
                        } else {
                            errorMsg += "Please check your information and try again.";
                        }
                        
                        showAlert(errorAlert, errorMsg);
                    }
                } else {
                    // Offline mode - store in localStorage for demo
                    const storedUsers = JSON.parse(localStorage.getItem('registered_users') || '[]');
                    
                    // Check if user already exists
                    const existingUser = storedUsers.find(u => u.username === username || u.email === email);
                    if (existingUser) {
                        showAlert(errorAlert, "User with this username or email already exists (offline mode).");
                        return;
                    }
                    
                    // Create new user
                    const newUser = {
                        id: storedUsers.length + 1,
                        username: username,
                        email: email,
                        password: password, // In real app, never store plain password
                        full_name: fullName,
                        phone_number: phoneNumber || '',
                        role: selectedRole,
                        registered_at: new Date().toISOString()
                    };
                    
                    storedUsers.push(newUser);
                    localStorage.setItem('registered_users', JSON.stringify(storedUsers));
                    
                    showAlert(successAlert, "Registration successful (offline mode)! Redirecting to login...", false);
                    
                    setTimeout(() => {
                        window.location.href = `loginform.html?registered=true&email=${encodeURIComponent(email)}&offline=true`;
                    }, APP_CONFIG.TIMEOUTS.REDIRECT_DELAY);
                }
            } catch (error) {
                console.error("Network error:", error);
                showAlert(errorAlert, "Network error. Please check your connection and try again.");
            } finally {
                // Reset button state
                registerButton.classList.remove('loading');
                registerButton.disabled = false;
                registerButton.innerHTML = '<i class="fas fa-user-plus"></i><span>Create Account</span>';
            }
        });

        // Real-time validation indicators
        passwordInput.addEventListener('input', function() {
            const validation = validatePassword(this.value);
            const parent = this.closest('.input-wrapper');
            if (this.value.length > 0 && !validation.isValid) {
                parent.style.borderColor = 'var(--error)';
            } else if (this.value.length > 0) {
                parent.style.borderColor = 'var(--success)';
            } else {
                parent.style.borderColor = '';
            }
        });

        confirmPasswordInput.addEventListener('input', function() {
            const parent = this.closest('.input-wrapper');
            if (this.value.length > 0 && this.value !== passwordInput.value) {
                parent.style.borderColor = 'var(--error)';
            } else if (this.value.length > 0) {
                parent.style.borderColor = 'var(--success)';
            } else {
                parent.style.borderColor = '';
            }
        });

        // Clear alerts on input
        [fullNameInput, emailInput, usernameInput, phoneNumberInput, passwordInput, confirmPasswordInput].forEach(input => {
            input.addEventListener('input', () => {
                errorAlert.style.display = 'none';
                if (input.closest('.input-wrapper')) {
                    input.closest('.input-wrapper').style.borderColor = '';
                }
            });
        });

        // Keyboard shortcut
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !registerButton.disabled) {
                registerForm.requestSubmit();
            }
            if (e.key === 'Escape') {
                registerForm.reset();
            }
        });

        // Start connection monitoring
        startConnectionMonitoring();

        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            stopConnectionMonitoring();
        });

        // Focus first field
        fullNameInput.focus();
    </script>
</body>
</html>
